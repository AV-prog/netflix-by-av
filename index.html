<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Netflix-by-AV</title>
    <link rel="shortcut icon" href="images/netflix-favicon.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/09dda602fe.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar_container">
            <img src="images/Netflix-Logo.png" alt="Netflix Logo" class="navbar_logo">
            <ul class="navbar_menu">
                <li class="navbar_btn">
                    <a href="#" class="button" id="signin">Sign In</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero" id="home">
        <div class="hero_container">
            <h1 class="hero_heading ">Unlimited movies, TV shows, and more</h1>
            <p class="hero_description">Starts at ₦2,500. Cancel anytime.</p>
            <p class="hero_invite">Ready to watch? Enter your email to create or restart your membership.</p>
            <div class="get_started">
                <input type="text" placeholder="Enter your email address" id="hero_input">
                <button class="main_btn"><a href="#hero_input">Get Started <i class="fa-solid fa-angle-right"></i></a></button>
            </div>
        </div>
    </div>
</body>
</html>
